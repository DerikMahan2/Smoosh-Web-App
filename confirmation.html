<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smoosh - Order Confirmation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         HEADER
         ========================================= -->

    <header>

        <h1>SMOOSH</h1>

        <p>
            Burgers. Dogs. Smooshed Right.
        </p>

    </header>


    <!-- =========================================
         NAVIGATION
         ========================================= -->

    <nav class="main-nav">

        <a href="index.html">
            Menu
        </a>

        <a href="cart.html">
            Cart
        </a>

        <a href="reviews.html">
            Reviews
        </a>

    </nav>


    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <main>

        <section>

            <h2>
                Order Confirmed
            </h2>

            <p class="page-intro">
                Your Smoosh order has been received.
            </p>


            <!-- ORDER CONFIRMATION GENERATED BY JAVASCRIPT -->

            <div id="confirmationDetails">

                <p>
                    Loading your order confirmation...
                </p>

            </div>


            <!-- NEXT ACTIONS -->

            <div class="confirmation-actions">

                <button
                    type="button"
                    onclick="startNewOrder()"
                >
                    Start New Order
                </button>

                <a
                    href="reviews.html"
                    class="button-link"
                >
                    Leave Feedback
                </a>

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer>

        <p>
            Smoosh Food Truck | Corpus Christi, Texas
        </p>

    </footer>


    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script src="script.js"></script>

</body>

</html>
