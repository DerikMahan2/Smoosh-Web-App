<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smoosh - Your Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         HEADER
         ========================================= -->

    <header>

        <h1>SMOOSH</h1>

        <p>
            Burgers. Dogs. Smooshed Right.
        </p>

    </header>


    <!-- =========================================
         NAVIGATION
         ========================================= -->

    <nav class="main-nav">

        <a href="index.html">
            Menu
        </a>

        <a href="cart.html" class="active">
            Cart
        </a>

        <a href="reviews.html">
            Reviews
        </a>

    </nav>


    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <main>

        <section>

            <h2>
                Your Order
            </h2>

            <p class="page-intro">
                Review your selections before continuing to checkout.
            </p>


            <!-- CART CONTENT GENERATED BY JAVASCRIPT -->

            <div id="cartItems">

                <p>
                    Your cart is currently empty.
                </p>

            </div>


            <!-- ORDER TOTAL -->

            <div id="cartTotal">

                <p>
                    <strong>
                        Order Total: $0.00
                    </strong>
                </p>

            </div>


            <!-- CART BUTTONS -->

            <div class="cart-actions">

                <button
                    type="button"
                    onclick="continueShopping()"
                >
                    Continue Shopping
                </button>


                <button
                    type="button"
                    onclick="clearCart()"
                >
                    Clear Order
                </button>


                <button
                    type="button"
                    onclick="proceedToCheckout()"
                >
                    Proceed to Checkout
                </button>

            </div>


            <!-- CART MESSAGE -->

            <div id="cartMessage"></div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer>

        <p>
            Smoosh Food Truck | Corpus Christi, Texas
        </p>

    </footer>


    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script src="script.js"></script>

</body>

</html>
